name: Monitor Xiaochan Update

on:
  schedule:
    - cron: '0 * * * *' # 姣忓皬鏃舵墽琛屼竴娆?
  workflow_dispatch: # 鏀寔鎵嬪姩瑙﹀彂

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check for updates
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          REPO="lyrric/xiaochan"
          FILE="last_check.json"
          
          # 鑾峰彇鏈€鏂版暟鎹?
          # 鏀圭敤鑾峰彇 releases 鍒楄〃鐨勭涓€涓紝浠ュ吋瀹?Pre-release
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/$REPO/releases")
          RELEASE_TAG=$(echo $LATEST_RELEASE | jq -r '.[0].tag_name // ""')
          
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/$REPO/commits/master")
          COMMIT_SHA=$(echo $LATEST_COMMIT | jq -r '.sha // ""')
          COMMIT_MSG=$(echo $LATEST_COMMIT | jq -r '.commit.message // ""')

          # 璇诲彇鏃ф暟鎹?
          OLD_RELEASE=$(jq -r '.last_release_tag' $FILE)
          OLD_SHA=$(jq -r '.last_commit_sha' $FILE)

          NOTIFY_MSG=""
          UPDATED=false

          # 妫€鏌?Release 鏇存柊
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$OLD_RELEASE" ] && [ "$OLD_RELEASE" != "" ]; then
            NOTIFY_MSG="馃殌 **鍙戠幇鏂扮増鏈?*: $RELEASE_TAG  \n"
            UPDATED=true
          fi

          # 妫€鏌?Commit 鏇存柊
          if [ "$COMMIT_SHA" != "$OLD_SHA" ] && [ "$OLD_SHA" != "" ]; then
            NOTIFY_MSG="${NOTIFY_MSG}馃摑 **浠ｇ爜宸叉洿鏂?*:  \n- 鍐呭: $COMMIT_MSG  \n- SHA: \`${COMMIT_SHA:0:7}\`"
            UPDATED=true
          fi
          
          # 濡傛灉鏄涓€娆¤繍琛岋紝鍙褰曚笉閫氱煡
          if [ "$OLD_SHA" == "" ]; then
            echo "First run, initializing state..."
            echo "{\"last_release_tag\":\"$RELEASE_TAG\", \"last_commit_sha\":\"$COMMIT_SHA\"}" > $FILE
            UPDATED=true
          else
            if [ "$UPDATED" = true ]; then
              echo "{\"last_release_tag\":\"$RELEASE_TAG\", \"last_commit_sha\":\"$COMMIT_SHA\"}" > $FILE
              
              # 鍙戦€?Server閰?閫氱煡
              curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
                -d "title=姝害闇哥帇椁愭洿鏂版彁閱? \
                -d "desp=$NOTIFY_MSG"
              echo "Notification sent."
            else
              echo "No updates found."
            fi
          fi

      - name: Install dependencies
        run: pip install requests

      - name: Run data scraper
        env:
          XC_TOKEN: ${{ secrets.XC_TOKEN }}
          LAT: ${{ secrets.LAT }}
          LNG: ${{ secrets.LNG }}
          CITY_CODE: ${{ secrets.CITY_CODE }}
        run: python scripts/fetch_data.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_check.json data/shops.json
          git commit -m "Update last check state and shop data" || echo "No changes to commit"
          git push
