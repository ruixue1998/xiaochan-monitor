name: Monitor Xiaochan Update

on:
  schedule:
    - cron: '0 * * * *' # 姣忓皬鏃舵墽琛屼竴娆?
  workflow_dispatch: # 鏀寔鎵嬪姩瑙﹀彂

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check for updates
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          REPO="lyrric/xiaochan"
          FILE="last_check.json"
          
          # Get latest data (support pre-releases)
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/$REPO/releases")
          RELEASE_TAG=$(echo $LATEST_RELEASE | jq -r '.[0].tag_name // ""')
          
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/$REPO/commits/master")
          COMMIT_SHA=$(echo $LATEST_COMMIT | jq -r '.sha // ""')
          # Export commit message as env var to handle quotes safely
          export COMMIT_MSG=$(echo $LATEST_COMMIT | jq -r '.commit.message // ""')

          # Read old data
          OLD_RELEASE=$(jq -r '.last_release_tag' $FILE)
          OLD_SHA=$(jq -r '.last_commit_sha' $FILE)

          NOTIFY_MSG=""
          UPDATED=false

          # Check Release
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$OLD_RELEASE" ] && [ "$OLD_RELEASE" != "" ]; then
            NOTIFY_MSG="New Version: $RELEASE_TAG \n"
            UPDATED=true
          fi

          # Check Commit
          if [ "$COMMIT_SHA" != "$OLD_SHA" ] && [ "$OLD_SHA" != "" ]; then
            NOTIFY_MSG="${NOTIFY_MSG}Code Updated: \n- Msg: $COMMIT_MSG \n- SHA: ${COMMIT_SHA:0:7}"
            UPDATED=true
          fi
          
          # Persistence
          if [ "$OLD_SHA" == "" ]; then
            echo "First run, initializing..."
            echo "{\"last_release_tag\":\"$RELEASE_TAG\", \"last_commit_sha\":\"$COMMIT_SHA\"}" > $FILE
            UPDATED=true
          else
            if [ "$UPDATED" = true ]; then
              echo "{\"last_release_tag\":\"$RELEASE_TAG\", \"last_commit_sha\":\"$COMMIT_SHA\"}" > $FILE
              if [ -n "$NOTIFY_MSG" ]; then
                curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
                  -d "title=Xiaochan Update" \
                  --data-urlencode "desp=$NOTIFY_MSG"
              fi
            fi
          fi

      - name: Install dependencies
        run: pip install requests

      - name: Run data scraper
        env:
          XC_TOKEN: ${{ secrets.XC_TOKEN }}
          LAT: ${{ secrets.LAT }}
          LNG: ${{ secrets.LNG }}
          CITY_CODE: ${{ secrets.CITY_CODE }}
        run: python scripts/fetch_data.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_check.json data/shops.json
          git commit -m "Update last check state and shop data" || echo "No changes to commit"
          git push
